services:
  gateway:
    build: ./gateway
    ports: ["8080:80"]
    depends_on: [frontend, results-service]

  frontend:
    build: ./frontend

  results-service:
    build: ./services/results-service
    environment:
      PREDICTION_SERVICE_URL: http://prediction-service:8001
      LOG_LEVEL: info
    depends_on:
      prediction-service:
        condition: service_healthy

  prediction-service:
    build:
      context: .
      dockerfile: services/prediction-service/Dockerfile
    environment:
      MODEL_PATH: /app/models/model_v1.joblib
      USE_MOCK_MODEL: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
