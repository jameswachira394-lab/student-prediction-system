name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same pull request. Never cancel runs on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  # Phase 1: the prediction service returns fake predictions.

  USE_MOCK_MODEL: ${{ vars.USE_MOCK_MODEL || 'true' }}

jobs:
 
  # 1. Lint
 
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .


  # 2. Unit tests, one job per Python service

  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [prediction-service, results-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      MODEL_PATH: ${{ github.workspace }}/ml/models/model_v1.joblib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: |
          set +e
          pytest -q
          code=$?
          # pytest exits with 5 when it finds no tests. Tolerated while the project
          # is being set up, but flagged. Remove this exception once tests exist.
          if [ "$code" -eq 5 ]; then
            echo "::warning::No tests found in ${{ matrix.service }}. Add at least a health endpoint test."
            exit 0
          fi
          exit "$code"


  # 3. Frontend: lint, test and build (skipped for a plain HTML project)

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Detect Node project
        id: node
        run: |
          if [ -f package.json ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No package.json in frontend/, skipping the Node build."
          fi

      - uses: actions/setup-node@v4
        if: steps.node.outputs.found == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.node.outputs.found == 'true'
        run: npm ci

      - name: Lint
        if: steps.node.outputs.found == 'true'
        run: npm run lint --if-present

      - name: Test
        if: steps.node.outputs.found == 'true'
        run: npm test --if-present

      - name: Build
        if: steps.node.outputs.found == 'true'
        run: npm run build --if-present

  
  # 4. Docker: lint each Dockerfile and make sure each image builds
 
  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          # The prediction service needs ml/models, which lives outside its own
          # folder, so its build context is the repository root.
          - service: prediction-service
            context: .
            dockerfile: services/prediction-service/Dockerfile
          - service: results-service
            context: services/results-service
            dockerfile: services/results-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          failure-threshold: error

      - uses: docker/setup-buildx-action@v3

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

 
  # 5. Smoke test: start the whole stack and make real requests

  smoke-test:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [lint, test, frontend, docker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Prepare settings
        run: |
          if [ -f .env.example ]; then cp .env.example .env; fi

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Check API health through the gateway
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            http://localhost:8080/api/health

      - name: Request a prediction through the gateway
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-connrefused \
            -X POST http://localhost:8080/api/predictions \
            -H "Content-Type: application/json" \
            -d '{"study_hours": 12, "attendance": 85, "previous_score": 64}' \
            | tee response.json
          echo
          jq -e '.predicted_score != null and .risk != null' response.json

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  
  # 6. Single gate for branch protection
  
  ci-passed:
    name: CI passed
    if: always()
    needs: [lint, test, frontend, docker, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check results of all jobs
        run: |
          echo "Results: ${{ join(needs.*.result, ', ') }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs did not pass."
            exit 1
          fi

  
  # 7. Publish images to GitHub Container Registry (main only)
  #    Images are tagged with the full commit SHA so any release can be
  #    redeployed or rolled back by tag.
  
  publish:
    name: Publish (${{ matrix.service }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: gateway
            dockerfile: gateway/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - service: prediction-service
            context: .
            dockerfile: services/prediction-service/Dockerfile
          - service: results-service
            context: services/results-service
            dockerfile: services/results-service/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image name (registry names must be lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
