version: 2

updates:
  # GitHub Actions workflows in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Root environment
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: scikit-learn
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Python service: prediction-service
  - package-ecosystem: pip
    directory: /services/prediction-service
    schedule:
      interval: weekly
    ignore:
      # The saved model file is tied to the scikit-learn version it was trained with
      - dependency-name: scikit-learn
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Python service: results-service
  - package-ecosystem: pip
    directory: /services/results-service
    schedule:
      interval: weekly

  # Base images in each Dockerfile
  - package-ecosystem: docker
    directory: /gateway
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/prediction-service
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /services/results-service
    schedule:
      interval: weekly
